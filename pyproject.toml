[project]
name = "beacon"
version = "0.1.0"
description = "DNS and service discovery: zones, resolvers, caches, and honest answers"
requires-python = ">=3.11"

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RET",
    "SIM", "ARG", "PL", "RUF",
]
ignore = [
    "N818", "PLR2004", "PLR0913", "PLR0912", "PLR0911", "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0915", "ARG002"]
"beacon/cli.py" = ["PLC0415"]
